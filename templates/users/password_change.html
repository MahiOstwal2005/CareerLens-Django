{% extends 'base.html' %}
{% load crispy_forms_tags %}

{% block content %}
<div class="container py-5 my-4 animate-fade-in">
    <div class="row justify-content-center">
        <div class="col-lg-6">
            <div class="card border-0 shadow-sm rounded-4 overflow-hidden">
                <div class="card-header bg-white p-4 pb-0 border-0">
                    <h4 class="mb-0 fw-bold" style="color: #0b2046;">Change Password</h4>
                    <p class="text-muted small mt-1">Please enter your old password, for security's sake, and then enter your new password twice so we can verify you typed it in correctly.</p>
                </div>
                <div class="card-body p-4 bg-white">
                    <form method="POST">
                        {% csrf_token %}
                        {{ form|crispy }}
                        
                        <div class="d-flex justify-content-end gap-3 mt-4">
                            <a href="{% url 'profile' %}" class="btn btn-light px-4 fw-semibold border">Cancel</a>
                            <button type="submit" class="btn btn-primary px-4 fw-semibold">Update Password</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
